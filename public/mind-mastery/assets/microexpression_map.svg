<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="#152422" stroke="#2a3c39" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" fill="#f5f1e8" letter-spacing="1">PAUL EKMAN'S 7 UNIVERSAL MICROEXPRESSIONS (FACS MAP)</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" fill="#a2b5b0">Non-Verbal Leakage Lasting 1/25th of a Second: Involuntary Facial Action Units</text>
  <line x1="160" y1="72" x2="740" y2="72" stroke="#2a3c39" stroke-width="1"/>

  <!-- Row 1: 4 Cards (Anger, Fear, Disgust, Contempt) -->
  <!-- Card 1: Anger -->
  <g transform="translate(60, 95)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#bd5342" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#f88975">ANGER</text>
    <!-- Stylized Face -->
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Eyebrows lowered and pulled together (AU 4) -->
    <line x1="68" y1="68" x2="85" y2="75" stroke="#f88975" stroke-width="2.5"/>
    <line x1="112" y1="68" x2="95" y2="75" stroke="#f88975" stroke-width="2.5"/>
    <!-- Glaring eyes (AU 5) -->
    <circle cx="76" cy="80" r="3" fill="#f5f1e8"/>
    <circle cx="104" cy="80" r="3" fill="#f5f1e8"/>
    <!-- Thin, compressed lips (AU 23/24) -->
    <line x1="75" y1="102" x2="105" y2="102" stroke="#f88975" stroke-width="3"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 4 + 5 + 23</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Brows drawn down, tight lips</text>
  </g>

  <!-- Card 2: Fear -->
  <g transform="translate(260, 95)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#3ba49a" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#55cfc1">FEAR</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Eyebrows raised and flat (AU 1 + 2 + 4) -->
    <line x1="68" y1="66" x2="86" y2="64" stroke="#55cfc1" stroke-width="2"/>
    <line x1="112" y1="66" x2="94" y2="64" stroke="#55cfc1" stroke-width="2"/>
    <!-- Wide sclera visible (AU 5) -->
    <circle cx="76" cy="78" r="4.5" fill="none" stroke="#f5f1e8" stroke-width="1.5"/>
    <circle cx="76" cy="78" r="2" fill="#f5f1e8"/>
    <circle cx="104" cy="78" r="4.5" fill="none" stroke="#f5f1e8" stroke-width="1.5"/>
    <circle cx="104" cy="78" r="2" fill="#f5f1e8"/>
    <!-- Open, horizontally stretched mouth (AU 20) -->
    <ellipse cx="90" cy="103" rx="14" ry="5" fill="none" stroke="#55cfc1" stroke-width="2"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 1 + 2 + 5 + 20</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Upper sclera exposed</text>
  </g>

  <!-- Card 3: Disgust -->
  <g transform="translate(460, 95)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#d4af37" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#f0cb75">DISGUST</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Wrinkled nose bridge (AU 9) -->
    <path d="M 85 82 Q 90 77 95 82" fill="none" stroke="#f0cb75" stroke-width="2"/>
    <!-- Raised upper lip (AU 10) -->
    <path d="M 75 104 Q 90 94 105 104" fill="none" stroke="#f0cb75" stroke-width="2.5"/>
    <!-- Squinting lower eyelids (AU 7) -->
    <line x1="70" y1="78" x2="82" y2="78" stroke="#f5f1e8" stroke-width="1.5"/>
    <line x1="98" y1="78" x2="110" y2="78" stroke="#f5f1e8" stroke-width="1.5"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 9 + 10</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Nose bridge wrinkles</text>
  </g>

  <!-- Card 4: Contempt (The Only Asymmetric Cue) -->
  <g transform="translate(660, 95)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#bd5342" stroke-width="2"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#e5735f">CONTEMPT ★</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Eyes neutral or assessing -->
    <circle cx="76" cy="78" r="2.5" fill="#f5f1e8"/>
    <circle cx="104" cy="78" r="2.5" fill="#f5f1e8"/>
    <!-- Unilateral lip corner pulled up & back (AU R12 / L14) -->
    <path d="M 74 102 Q 88 102 108 94" fill="none" stroke="#e5735f" stroke-width="3"/>
    <circle cx="108" cy="94" r="3" fill="#e5735f"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU R12 / L14 (Unilateral)</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">1-sided smirk: Moral superiority</text>
  </g>

  <!-- Row 2: 3 Cards (Joy/Duchenne Smile, Sadness, Surprise) -->
  <!-- Card 5: Joy (Genuine Duchenne Smile vs Fake) -->
  <g transform="translate(160, 305)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#55cfc1" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#55cfc1">GENUINE JOY</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Crow's feet wrinkles (AU 6 - Orbicularis Oculi) -->
    <path d="M 64 74 L 58 71 M 64 78 L 56 78 M 64 82 L 58 85" stroke="#f0cb75" stroke-width="1.5"/>
    <path d="M 116 74 L 122 71 M 116 78 L 124 78 M 116 82 L 122 85" stroke="#f0cb75" stroke-width="1.5"/>
    <path d="M 70 78 Q 76 74 82 78" fill="none" stroke="#f5f1e8" stroke-width="2"/>
    <path d="M 98 78 Q 104 74 110 78" fill="none" stroke="#f5f1e8" stroke-width="2"/>
    <!-- Symmetrical upward curved smile (AU 12) -->
    <path d="M 72 96 Q 90 114 108 96" fill="none" stroke="#55cfc1" stroke-width="2.8"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 6 + 12 (Duchenne)</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Eye corners crinkle; fake lacks AU6</text>
  </g>

  <!-- Card 6: Sadness -->
  <g transform="translate(360, 305)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#2a3c39" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#a2b5b0">SADNESS</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- Inner eyebrow corners raised (AU 1) & pulled (AU 4) -->
    <path d="M 68 76 Q 80 68 86 74" fill="none" stroke="#a2b5b0" stroke-width="2"/>
    <path d="M 112 76 Q 100 68 94 74" fill="none" stroke="#a2b5b0" stroke-width="2"/>
    <!-- Lip corners pulled down (AU 15) -->
    <path d="M 74 105 Q 90 98 106 105" fill="none" stroke="#a2b5b0" stroke-width="2.5"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 1 + 4 + 15</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Inverted horseshoe mouth</text>
  </g>

  <!-- Card 7: Surprise -->
  <g transform="translate(560, 305)">
    <rect width="180" height="185" rx="6" fill="#1a2e2a" stroke="#f0cb75" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#f0cb75">SURPRISE</text>
    <circle cx="90" cy="80" r="38" fill="#142421" stroke="#3ba49a" stroke-width="1"/>
    <!-- High arched brows (AU 1 + 2) -->
    <path d="M 68 68 Q 77 58 86 68" fill="none" stroke="#f0cb75" stroke-width="2"/>
    <path d="M 94 68 Q 103 58 112 68" fill="none" stroke="#f0cb75" stroke-width="2"/>
    <!-- Wide eyes (AU 5) -->
    <circle cx="77" cy="78" r="4" fill="#f5f1e8"/>
    <circle cx="103" cy="78" r="4" fill="#f5f1e8"/>
    <!-- Jaw dropped, relaxed oval (AU 26) -->
    <ellipse cx="90" cy="103" rx="8" ry="12" fill="none" stroke="#f0cb75" stroke-width="2.2"/>
    <text x="90" y="145" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="10.5" font-weight="700" fill="#f5f1e8">AU 1 + 2 + 5 + 26</text>
    <text x="90" y="165" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Duration &lt; 1 sec; longer = fake</text>
  </g>
</svg>
