<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12201e"/>
      <stop offset="50%" stop-color="#1c3532"/>
      <stop offset="100%" stop-color="#0f1918"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cb75"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8214"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55cfc1"/>
      <stop offset="100%" stop-color="#217c72"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f88975"/>
      <stop offset="100%" stop-color="#bd5342"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Ornate Double Border -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#cfc9bb" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="46" y="46" width="708" height="908" fill="none" stroke="#cfc9bb" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Corner Filigree Emblems -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M46 76 Q76 76 76 46"/>
    <path d="M754 76 Q724 76 724 46"/>
    <path d="M46 924 Q76 924 76 954"/>
    <path d="M754 924 Q724 924 724 954"/>
  </g>

  <!-- Header Branding -->
  <text x="400" y="110" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="14" letter-spacing="8" fill="#cfc9bb" font-weight="700">F0UNDR BOOK · SPECIAL EDITION</text>
  <line x1="280" y1="125" x2="520" y2="125" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="400" cy="125" r="3.5" fill="#e5735f"/>

  <!-- Main Title -->
  <text x="400" y="195" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="44" font-weight="700" fill="#f5f1e8" letter-spacing="2">THE ART OF</text>
  <text x="400" y="255" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="56" font-style="italic" font-weight="600" fill="url(#goldGrad)" letter-spacing="1">Mental Mastery</text>

  <!-- Subtitle Ribbon -->
  <text x="400" y="300" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="13.5" letter-spacing="4" fill="#a2b5b0" font-weight="600">HOW TO LEARN FAST · READ MINDS · DECODE BEHAVIOR</text>

  <!-- Centerpiece Artwork: The Transcendent Mind Palace & Eye of Perception -->
  <g transform="translate(400, 520)">
    <!-- Sacred Geometry & Cognitive Gears -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#3ba49a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="120" fill="#142624" stroke="#cfc9bb" stroke-width="0.7" stroke-opacity="0.3"/>

    <!-- Geometric Ray Matrix -->
    <g stroke="url(#tealGrad)" stroke-width="1" stroke-opacity="0.35">
      <line x1="0" y1="-175" x2="0" y2="175"/>
      <line x1="-175" y1="0" x2="175" y2="0"/>
      <line x1="-124" y1="-124" x2="124" y2="124"/>
      <line x1="-124" y1="124" x2="124" y2="-124"/>
    </g>

    <!-- Neural Pathways & Synaptic Constellations -->
    <g stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.75" fill="none">
      <path d="M-80 -60 Q-40 -110 0 -90 Q40 -110 80 -60"/>
      <path d="M-90 20 Q-50 -30 0 -15 Q50 -30 90 20"/>
      <path d="M-70 80 Q-30 40 0 50 Q30 40 70 80"/>
      <path d="M-30 -130 Q0 -70 30 -130"/>
    </g>
    <!-- Synaptic Nodes -->
    <g fill="#f88975">
      <circle cx="-80" cy="-60" r="4.5"/>
      <circle cx="80" cy="-60" r="4.5"/>
      <circle cx="0" cy="-90" r="5" fill="#f0cb75"/>
      <circle cx="-90" cy="20" r="4"/>
      <circle cx="90" cy="20" r="4"/>
      <circle cx="0" cy="-15" r="5" fill="#55cfc1"/>
      <circle cx="-70" cy="80" r="4"/>
      <circle cx="70" cy="80" r="4"/>
      <circle cx="0" cy="50" r="4.5" fill="#f0cb75"/>
    </g>

    <!-- Classical Mind Palace Archways -->
    <path d="M-50 85 L-50 -20 Q0 -65 50 -20 L50 85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <path d="M-35 85 L-35 -10 Q0 -48 35 -10 L35 85 Z" fill="none" stroke="#55cfc1" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Central Perception Eye (Observation & Mind Reading) -->
    <g transform="translate(0, 0)">
      <path d="M-45 0 Q0 -28 45 0 Q0 28 -45 0 Z" fill="#0d1817" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#tealGrad)" stroke="#f5f1e8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7.5" fill="#0f1918"/>
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- Floating Cognitive Symbols -->
    <!-- Accelerated Learning (Lightning / Flow) -->
    <path d="M-135 -40 L-120 -40 L-125 -15 L-110 -15 L-130 20 L-124 -5 L-138 -5 Z" fill="#f0cb75" opacity="0.85"/>
    <!-- Perception Radar Waves -->
    <path d="M110 -25 A30 30 0 0 1 110 25" fill="none" stroke="#55cfc1" stroke-width="2"/>
    <path d="M125 -35 A45 45 0 0 1 125 35" fill="none" stroke="#55cfc1" stroke-width="1.8" stroke-opacity="0.6"/>
  </g>

  <!-- Core Pillars Tags -->
  <g transform="translate(400, 750)">
    <rect x="-310" y="-20" width="190" height="40" rx="3" fill="#152623" stroke="#3ba49a" stroke-width="1.2"/>
    <text x="-215" y="5" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f5f1e8" letter-spacing="1">⚡ ULTRALEARNING</text>

    <rect x="-95" y="-20" width="190" height="40" rx="3" fill="#152623" stroke="#bd5342" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f5f1e8" letter-spacing="1">👁️ MIND READING</text>

    <rect x="120" y="-20" width="190" height="40" rx="3" fill="#152623" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="215" y="5" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f5f1e8" letter-spacing="1">🏛️ MIND PALACE</text>
  </g>

  <!-- Author Badge & Seal -->
  <g transform="translate(400, 870)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#cfc9bb" stroke-width="0.8" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="url(#goldGrad)"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="17" font-weight="700" fill="#f5f1e8" letter-spacing="2">HUZAIFA &amp; THE F0UNDR TEAM</text>
    <text x="0" y="54" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#a2b5b0" letter-spacing="3">ACADEMY OF COGNITIVE SCIENCE &amp; APPLIED PSYCHOLOGY</text>
  </g>
</svg>
