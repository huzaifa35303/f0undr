<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Clean Alabaster Canvas -->
  <rect width="800" height="1000" fill="url(#coverBg)"/>
  
  <!-- Architectural Border & Crop Marks -->
  <rect x="40" y="40" width="720" height="920" rx="4" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="52" y="52" width="696" height="896" rx="2" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="4 4"/>

  <!-- Top Series Eyebrow -->
  <g font-family="'Plus Jakarta Sans', -apple-system, sans-serif" text-anchor="middle">
    <text x="400" y="96" font-size="11" font-weight="800" letter-spacing="4" fill="#64748b">F0UNDR PRESS · SPECIAL EDITION · VOL. 01</text>
    <line x1="260" y1="112" x2="540" y2="112" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Book Main Title -->
  <g text-anchor="middle">
    <text x="400" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="6" fill="#2563eb">THE ART OF</text>
    <text x="400" y="224" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="800" letter-spacing="-0.5" fill="#0f172a">MENTAL MASTERY</text>
    <text x="400" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="0.5" fill="#475569">Accelerated Learning, Forensic Non-Verbal Decoding &amp; Cognitive Architecture</text>
  </g>

  <!-- Central Kinetic Artwork: Geometric Neural Latticework -->
  <g transform="translate(400, 520)">
    <!-- Concentric Precision Rings -->
    <circle r="180" fill="none" stroke="#f1f5f9" stroke-width="2"/>
    <circle r="150" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 6"/>
    <circle r="120" fill="url(#glowRing)"/>
    <circle r="120" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle r="90" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle r="60" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- Dynamic Vector Crossings -->
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="-135" y1="-135" x2="135" y2="135" stroke="#e2e8f0" stroke-width="0.8"/>
    <line x1="-135" y1="135" x2="135" y2="-135" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Orbital Node Links -->
    <path d="M-85,-40 C-30,-110 30,-110 85,-40 C110,30 60,95 0,95 C-60,95 -110,30 -85,-40 Z" fill="none" stroke="url(#sapphireGrad)" stroke-width="2.5"/>
    <path d="M-40,-85 C110,-30 110,30 -40,85 C-95,60 -95,-60 -40,-85 Z" fill="none" stroke="url(#violetGrad)" stroke-width="1.8" opacity="0.85"/>

    <!-- Core Focal Monogram -->
    <circle r="28" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="10" font-family="'Playfair Display', serif" font-size="28" font-weight="900" fill="#2563eb" text-anchor="middle">Ψ</text>

    <!-- Synaptic Nodes -->
    <circle cx="-85" cy="-40" r="6" fill="#2563eb"/>
    <circle cx="85" cy="-40" r="6" fill="#2563eb"/>
    <circle cx="0" cy="95" r="7" fill="#6366f1"/>
    <circle cx="-40" cy="-85" r="5" fill="#0284c7"/>
    <circle cx="-40" cy="85" r="5" fill="#d97706"/>
    <circle cx="120" cy="0" r="4" fill="#059669"/>
    <circle cx="-120" cy="0" r="4" fill="#059669"/>
  </g>

  <!-- Technical Spec Blocks -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">
    <text x="80" y="780">NEUROPLASTICITY</text>
    <text x="80" y="796" fill="#0f172a" font-weight="700">LTP AXON CONDUCTION</text>

    <text x="320" y="780">SPATIAL LOCI</text>
    <text x="320" y="796" fill="#0f172a" font-weight="700">MAJOR CODE SYSTEM</text>

    <text x="560" y="780">FORENSIC FACS</text>
    <text x="560" y="796" fill="#0f172a" font-weight="700">EKMAN MICROEXPRESSIONS</text>
  </g>

  <line x1="80" y1="816" x2="720" y2="816" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Author Footnote -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">
    <text x="400" y="870" font-size="14" font-weight="800" letter-spacing="3" fill="#0f172a">HUZAIFA &amp; THE F0UNDR TEAM</text>
    <text x="400" y="894" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748b">COGNITIVE RESEARCH PRESS · OXFORD &amp; SILICON VALLEY</text>
  </g>
</svg>
