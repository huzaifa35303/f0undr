<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="500" rx="8" fill="#152422" stroke="#2a3c39" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" fill="#f5f1e8" letter-spacing="1">THE SUPERTHINKING COGNITIVE LATTICEWORK</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" fill="#a2b5b0">Charlie Munger &amp; Elon Musk's High-Stakes Rapid Problem-Solving Engines</text>
  <line x1="150" y1="72" x2="750" y2="72" stroke="#2a3c39" stroke-width="1"/>

  <!-- 4 Core Columns / Cards of Mental Models -->
  <!-- Card 1: First Principles -->
  <g transform="translate(45, 95)">
    <rect width="185" height="340" rx="6" fill="#1a2e2a" stroke="#3ba49a" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="42" rx="6" fill="#203a35"/>
    <text x="92" y="27" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" font-weight="800" fill="#55cfc1">FIRST PRINCIPLES</text>
    
    <text x="18" y="75" font-family="'Iowan Old Style', serif" font-size="14" font-weight="700" fill="#f5f1e8">Boil to Truths</text>
    <text x="18" y="96" font-family="'Avenir Next', sans-serif" font-size="11" fill="#a2b5b0">Strip all conventions, analogies, and hearsay down to fundamental physics.</text>

    <!-- Mini Visual Diagram: Atom breakdown -->
    <circle cx="92" cy="160" r="32" fill="none" stroke="#3ba49a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="92" cy="160" r="16" fill="none" stroke="#f0cb75" stroke-width="1.5"/>
    <circle cx="92" cy="160" r="5" fill="#f88975"/>

    <text x="18" y="235" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f0cb75">Key Question:</text>
    <text x="18" y="255" font-family="'Iowan Old Style', serif" font-size="11.5" font-style="italic" fill="#f5f1e8">"What is absolutely true, not just what everyone copies?"</text>

    <text x="18" y="315" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="700" fill="#3ba49a">Musk / Aristotle</text>
  </g>

  <!-- Card 2: Inversion -->
  <g transform="translate(255, 95)">
    <rect width="185" height="340" rx="6" fill="#1a2e2a" stroke="#bd5342" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="42" rx="6" fill="#2d2220"/>
    <text x="92" y="27" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" font-weight="800" fill="#f88975">INVERSION</text>
    
    <text x="18" y="75" font-family="'Iowan Old Style', serif" font-size="14" font-weight="700" fill="#f5f1e8">Invert, Always Invert</text>
    <text x="18" y="96" font-family="'Avenir Next', sans-serif" font-size="11" fill="#a2b5b0">Instead of asking how to succeed, map out how to guarantee catastrophic failure—and avoid it.</text>

    <!-- Mini Visual Diagram: Inverted Double Arrows -->
    <g transform="translate(92, 160)">
      <path d="M-20 -25 L-20 25 M-27 15 L-20 25 L-13 15" stroke="#55cfc1" stroke-width="2.5" fill="none"/>
      <path d="M20 25 L20 -25 M13 -15 L20 -25 L27 -15" stroke="#f88975" stroke-width="2.5" fill="none"/>
    </g>

    <text x="18" y="235" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f0cb75">Key Question:</text>
    <text x="18" y="255" font-family="'Iowan Old Style', serif" font-size="11.5" font-style="italic" fill="#f5f1e8">"What would ruin this completely? How do I kill that risk?"</text>

    <text x="18" y="315" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="700" fill="#f88975">Jacobi / Munger</text>
  </g>

  <!-- Card 3: Second-Order Thinking -->
  <g transform="translate(465, 95)">
    <rect width="185" height="340" rx="6" fill="#1a2e2a" stroke="#d4af37" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="42" rx="6" fill="#2d2a1b"/>
    <text x="92" y="27" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" font-weight="800" fill="#f0cb75">2ND-ORDER LOGIC</text>
    
    <text x="18" y="75" font-family="'Iowan Old Style', serif" font-size="14" font-weight="700" fill="#f5f1e8">"And Then What?"</text>
    <text x="18" y="96" font-family="'Avenir Next', sans-serif" font-size="11" fill="#a2b5b0">First-order produces immediate rewards; second and third-order bring long-term consequences.</text>

    <!-- Mini Visual Diagram: Domino cascade -->
    <g transform="translate(42, 145)">
      <rect x="0" y="10" width="12" height="32" rx="2" fill="#3ba49a"/>
      <rect x="25" y="6" width="12" height="36" rx="2" fill="#55cfc1" transform="rotate(15, 25, 6)"/>
      <rect x="52" y="0" width="12" height="42" rx="2" fill="#f0cb75" transform="rotate(30, 52, 0)"/>
      <rect x="80" y="-8" width="12" height="50" rx="2" fill="#f88975" transform="rotate(45, 80, -8)"/>
    </g>

    <text x="18" y="235" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f0cb75">Key Question:</text>
    <text x="18" y="255" font-family="'Iowan Old Style', serif" font-size="11.5" font-style="italic" fill="#f5f1e8">"What happens after the immediate relief fades away?"</text>

    <text x="18" y="315" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="700" fill="#f0cb75">Howard Marks</text>
  </g>

  <!-- Card 4: Occam & Hanlon's Razor -->
  <g transform="translate(675, 95)">
    <rect width="185" height="340" rx="6" fill="#1a2e2a" stroke="#55cfc1" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="42" rx="6" fill="#1c3330"/>
    <text x="92" y="27" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" font-weight="800" fill="#55cfc1">COGNITIVE RAZORS</text>
    
    <text x="18" y="75" font-family="'Iowan Old Style', serif" font-size="14" font-weight="700" fill="#f5f1e8">Cut the Paranoid Noise</text>
    <text x="18" y="96" font-family="'Avenir Next', sans-serif" font-size="11" fill="#a2b5b0">Occam: The simplest explanation is usually right. Hanlon: Never attribute to malice what is incompetence.</text>

    <!-- Mini Visual Diagram: Scalpel / Razor blade -->
    <g transform="translate(92, 160)">
      <path d="M-30 -15 L25 -15 L35 0 L25 15 L-30 15 Z" fill="#203a35" stroke="#f5f1e8" stroke-width="1.5"/>
      <circle cx="-12" cy="0" r="5" fill="#f88975"/>
      <rect x="0" y="-3" width="18" height="6" fill="#f5f1e8"/>
    </g>

    <text x="18" y="235" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#f0cb75">Key Insight:</text>
    <text x="18" y="255" font-family="'Iowan Old Style', serif" font-size="11.5" font-style="italic" fill="#f5f1e8">Stop hallucinating complex conspiracies in human behavior.</text>

    <text x="18" y="315" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="700" fill="#55cfc1">William of Ockham</text>
  </g>

  <!-- Footer Banner -->
  <text x="450" y="475" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" fill="#f0cb75">★ The Lattice of Models: No single model explains reality; master profilers weave 5+ mental models simultaneously.</text>
</svg>
