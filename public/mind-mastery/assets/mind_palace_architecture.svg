<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="roomFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162725"/>
      <stop offset="100%" stop-color="#1b312e"/>
    </linearGradient>
    <linearGradient id="stationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5735f"/>
      <stop offset="100%" stop-color="#bd5342"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="#152422" stroke="#2a3c39" stroke-width="1.5"/>

  <!-- Title & Instructions -->
  <text x="450" y="38" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" fill="#f5f1e8" letter-spacing="1">THE SHERLOCKIAN METHOD OF LOCI (MIND PALACE)</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" fill="#a2b5b0">Architectural Floorplan: Clockwise Journey with Vivid Spatial Anchor Loci</text>
  <line x1="180" y1="72" x2="720" y2="72" stroke="#2a3c39" stroke-width="1"/>

  <!-- Main Room Blueprint -->
  <g transform="translate(100, 95)">
    <!-- Room Walls -->
    <rect x="0" y="0" width="700" height="380" rx="10" fill="url(#roomFloor)" stroke="#3ba49a" stroke-width="2.5"/>
    <!-- Floor Grid Lines -->
    <g stroke="#243d39" stroke-width="0.8" stroke-dasharray="4 4">
      <line x1="140" y1="0" x2="140" y2="380"/>
      <line x1="280" y1="0" x2="280" y2="380"/>
      <line x1="420" y1="0" x2="420" y2="380"/>
      <line x1="560" y1="0" x2="560" y2="380"/>
      <line x1="0" y1="126" x2="700" y2="126"/>
      <line x1="0" y1="254" x2="700" y2="254"/>
    </g>

    <!-- Path Journey Vector (Dotted Gold Path) -->
    <path d="M 60 360 L 60 80 L 350 50 L 640 80 L 640 330 L 480 340 L 350 200 L 200 340" fill="none" stroke="#f0cb75" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Locus 1: The Grand Oak Entrance Doorway -->
    <g transform="translate(60, 340)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text>
      <text x="32" y="5" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Entrance Threshold</text>
    </g>

    <!-- Locus 2: Antique Grandfather Clock -->
    <g transform="translate(60, 80)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text>
      <text x="32" y="5" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Grandfather Clock</text>
    </g>

    <!-- Locus 3: The Mahogany Executive Desk -->
    <g transform="translate(350, 50)">
      <rect x="-45" y="-20" width="90" height="40" rx="4" fill="#203a35" stroke="#3ba49a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text>
      <text x="0" y="36" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Mahogany Desk</text>
    </g>

    <!-- Locus 4: Stained-Glass Bay Window -->
    <g transform="translate(640, 80)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text>
      <text x="-32" y="5" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Bay Window</text>
    </g>

    <!-- Locus 5: The Ornate Marble Fireplace -->
    <g transform="translate(640, 330)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">5</text>
      <text x="-32" y="5" text-anchor="end" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Marble Fireplace</text>
    </g>

    <!-- Locus 6: Velvet Reading Armchair -->
    <g transform="translate(480, 340)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">6</text>
      <text x="0" y="-30" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Velvet Armchair</text>
    </g>

    <!-- Locus 7: Centerpiece Persian Rug & Pedestal -->
    <g transform="translate(350, 200)">
      <ellipse cx="0" cy="0" rx="55" ry="35" fill="#1b2f2c" stroke="#f0cb75" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">7</text>
      <text x="0" y="44" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f0cb75">Centerpiece Pedestal</text>
    </g>

    <!-- Locus 8: Bookshelf of Curiosities -->
    <g transform="translate(200, 340)">
      <circle cx="0" cy="0" r="22" fill="url(#stationGrad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="13" font-weight="800" fill="#ffffff">8</text>
      <text x="0" y="-30" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Tall Bookshelf</text>
    </g>
  </g>

  <!-- Golden Rule Footnote -->
  <text x="450" y="495" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11" fill="#f0cb75">★ Golden Rule of Loci: Never cross paths, maintain consistent perspective, and inject exaggerated emotional / sensory imagery.</text>
</svg>
