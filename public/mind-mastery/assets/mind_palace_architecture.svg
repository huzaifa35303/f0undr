<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="stationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Clean Editorial Background -->
  <rect width="900" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Instructions -->
  <text x="450" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="0.5">THE METHOD OF LOCI (MIND PALACE ARCHITECTURE)</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" fill="#64748b">Clockwise Sequential Route with 8 Fixed Spatial Anchor Loci</text>
  <line x1="180" y1="74" x2="720" y2="74" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Main Room Blueprint -->
  <g transform="translate(100, 92)">
    <!-- Room Walls -->
    <rect x="0" y="0" width="700" height="375" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Floor Grid Lines -->
    <g stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4 4">
      <line x1="140" y1="0" x2="140" y2="375"/>
      <line x1="280" y1="0" x2="280" y2="375"/>
      <line x1="420" y1="0" x2="420" y2="375"/>
      <line x1="560" y1="0" x2="560" y2="375"/>
      <line x1="0" y1="125" x2="700" y2="125"/>
      <line x1="0" y1="250" x2="700" y2="250"/>
    </g>

    <!-- Path Journey Vector (Electric Sapphire Dotted Path) -->
    <path d="M 60 335 L 60 75 L 350 48 L 640 75 L 640 325 L 480 335 L 350 195 L 200 335" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Locus 1: The Entrance Doorway -->
    <g transform="translate(60, 335)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text>
      <text x="30" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Entrance Threshold</text>
    </g>

    <!-- Locus 2: Grandfather Clock -->
    <g transform="translate(60, 75)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text>
      <text x="30" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Grandfather Clock</text>
    </g>

    <!-- Locus 3: Mahogany Executive Desk -->
    <g transform="translate(350, 48)">
      <rect x="-45" y="-18" width="90" height="36" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff">3</text>
      <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Mahogany Desk</text>
    </g>

    <!-- Locus 4: Bay Window -->
    <g transform="translate(640, 75)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text>
      <text x="-28" y="5" text-anchor="end" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Bay Window</text>
    </g>

    <!-- Locus 5: Marble Fireplace -->
    <g transform="translate(640, 325)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">5</text>
      <text x="-28" y="5" text-anchor="end" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Marble Fireplace</text>
    </g>

    <!-- Locus 6: Velvet Armchair -->
    <g transform="translate(480, 335)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">6</text>
      <text x="0" y="-28" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Velvet Armchair</text>
    </g>

    <!-- Locus 7: Centerpiece Pedestal -->
    <g transform="translate(350, 195)">
      <ellipse cx="0" cy="0" rx="55" ry="34" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">7</text>
      <text x="0" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Centerpiece Pedestal</text>
    </g>

    <!-- Locus 8: Tall Bookshelf -->
    <g transform="translate(200, 335)">
      <circle cx="0" cy="0" r="20" fill="url(#stationGrad)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">8</text>
      <text x="0" y="-28" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Tall Bookshelf</text>
    </g>
  </g>

  <!-- Golden Rule Footnote -->
  <rect x="120" y="480" width="660" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="450" y="497" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">★ Golden Rule of Loci: Never cross paths, maintain consistent perspective, and inject exaggerated emotional imagery.</text>
</svg>
