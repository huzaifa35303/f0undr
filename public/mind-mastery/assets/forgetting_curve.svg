<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <!-- Clean Editorial Background -->
  <rect width="900" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="450" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="0.5">THE EBBINGHAUS FORGETTING CURVE VS. SPACED REPETITION</text>
  <text x="450" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" fill="#64748b">Mathematical Decay of Unreinforced Memory vs. The Power of Strategic Intervals</text>
  <line x1="160" y1="82" x2="740" y2="82" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Chart Area Grid Lines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="120" x2="820" y2="120"/> <!-- 100% -->
    <line x1="120" y1="187" x2="820" y2="187"/> <!-- 75% -->
    <line x1="120" y1="255" x2="820" y2="255"/> <!-- 50% -->
    <line x1="120" y1="322" x2="820" y2="322"/> <!-- 25% -->
    <line x1="120" y1="390" x2="820" y2="390"/> <!-- 0% -->
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">
    <text x="105" y="125">100%</text>
    <text x="105" y="192">75%</text>
    <text x="105" y="260">50%</text>
    <text x="105" y="327">25%</text>
    <text x="105" y="394">0%</text>
  </g>

  <!-- X-Axis Labels -->
  <g font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="120" y="415">Day 0</text>
    <text x="230" y="415">Day 1 (24h)</text>
    <text x="370" y="415">Day 3</text>
    <text x="540" y="415">Day 7</text>
    <text x="730" y="415">Day 30</text>
  </g>

  <!-- Curve 0: Unreinforced Decay -->
  <path d="M 120 120 C 140 260 200 340 370 365 C 540 378 700 382 820 385" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="230" y="342" width="235" height="26" rx="4" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="240" y="359" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e11d48">Without Review: ~80% Lost in 48h</text>

  <!-- Curve 1: 1st Review (Day 1) -->
  <path d="M 230 260 L 230 120" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="230" cy="120" r="5" fill="#d97706"/>
  <path d="M 230 120 C 270 170 330 220 370 230" fill="none" stroke="#d97706" stroke-width="2.5"/>

  <!-- Curve 2: 2nd Review (Day 3) -->
  <path d="M 370 230 L 370 120" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="370" cy="120" r="5" fill="#7c3aed"/>
  <path d="M 370 120 C 420 150 490 175 540 185" fill="none" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- Curve 3: 3rd Review (Day 7) -->
  <path d="M 540 185 L 540 120" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="540" cy="120" r="5" fill="#0284c7"/>
  <path d="M 540 120 C 600 135 680 145 730 150" fill="none" stroke="#0284c7" stroke-width="3"/>

  <!-- Curve 4: 4th Review (Day 30) -->
  <path d="M 730 150 L 730 120" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="730" cy="120" r="5" fill="#2563eb"/>
  <path d="M 730 120 L 820 125" fill="none" stroke="#2563eb" stroke-width="3"/>
  
  <rect x="670" y="88" width="160" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="750" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Permanent Retention Lock</text>

  <!-- Legend Box -->
  <g transform="translate(430, 442)">
    <circle cx="0" cy="0" r="4.5" fill="#e11d48"/>
    <text x="12" y="4" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Exponential Decay (No Review)</text>
    
    <circle cx="210" cy="0" r="4.5" fill="#2563eb"/>
    <text x="222" y="4" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Active Recall Intervals (1-3-7-30 Days)</text>
  </g>
</svg>
