<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3c39" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#152422" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="8" fill="#152422" stroke="#2a3c39" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="450" y="42" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" fill="#f5f1e8" letter-spacing="1">THE EBBINGHAUS FORGETTING CURVE VS. SPACED REPETITION</text>
  <text x="450" y="66" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" fill="#a2b5b0">Mathematical Decay of Unreinforced Memory vs. The Power of Strategic Intervals</text>
  <line x1="160" y1="80" x2="740" y2="80" stroke="#2a3c39" stroke-width="1"/>

  <!-- Chart Area: Origin at (120, 390), Width 700, Height 270 -->
  <!-- Grid Lines -->
  <g stroke="#233532" stroke-width="1">
    <!-- Horizontal percentage lines -->
    <line x1="120" y1="120" x2="820" y2="120"/> <!-- 100% -->
    <line x1="120" y1="187" x2="820" y2="187"/> <!-- 75% -->
    <line x1="120" y1="255" x2="820" y2="255"/> <!-- 50% -->
    <line x1="120" y1="322" x2="820" y2="322"/> <!-- 25% -->
    <line x1="120" y1="390" x2="820" y2="390"/> <!-- 0% -->
  </g>

  <!-- Axes Labels (Y-Axis: Retention %) -->
  <g font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#a2b5b0" text-anchor="end">
    <text x="110" y="125">100%</text>
    <text x="110" y="192">75%</text>
    <text x="110" y="260">50%</text>
    <text x="110" y="327">25%</text>
    <text x="110" y="394">0%</text>
  </g>

  <!-- X-Axis: Time Intervals -->
  <g font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#a2b5b0" text-anchor="middle">
    <text x="120" y="415">Day 0</text>
    <text x="230" y="415">Day 1 (24h)</text>
    <text x="370" y="415">Day 3</text>
    <text x="540" y="415">Day 7</text>
    <text x="730" y="415">Day 30</text>
  </g>

  <!-- Curve 0: The Catastrophic Forgetting Curve (No Review) -->
  <path d="M 120 120 C 140 260 200 340 370 365 C 540 378 700 382 820 385" fill="none" stroke="#e5735f" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="260" y="360" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="700" fill="#e5735f">Without Review: ~80% Lost in 48h</text>

  <!-- Curve 1: 1st Review (Day 1) -->
  <path d="M 230 260 L 230 120" stroke="#f0cb75" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="230" cy="120" r="5" fill="#f0cb75"/>
  <path d="M 230 120 C 270 170 330 220 370 230" fill="none" stroke="#f0cb75" stroke-width="2.5"/>

  <!-- Curve 2: 2nd Review (Day 3) -->
  <path d="M 370 230 L 370 120" stroke="#3ba49a" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="370" cy="120" r="5" fill="#3ba49a"/>
  <path d="M 370 120 C 420 150 490 175 540 185" fill="none" stroke="#3ba49a" stroke-width="2.5"/>

  <!-- Curve 3: 3rd Review (Day 7) -->
  <path d="M 540 185 L 540 120" stroke="#55cfc1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="540" cy="120" r="5" fill="#55cfc1"/>
  <path d="M 540 120 C 600 135 680 145 730 150" fill="none" stroke="#55cfc1" stroke-width="3"/>

  <!-- Curve 4: 4th Review (Day 30) - Permanent Long-Term Storage -->
  <path d="M 730 150 L 730 120" stroke="#f5f1e8" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="730" cy="120" r="5" fill="#f5f1e8"/>
  <path d="M 730 120 L 820 125" fill="none" stroke="#f5f1e8" stroke-width="3"/>
  <text x="735" y="105" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="700" fill="#f5f1e8">Permanent Memory Lock</text>

  <!-- Legend Box -->
  <g transform="translate(480, 435)">
    <circle cx="0" cy="0" r="4" fill="#e5735f"/>
    <text x="10" y="4" font-family="'Avenir Next', sans-serif" font-size="10.5" fill="#a2b5b0">Unreviewed Decay</text>
    
    <circle cx="150" cy="0" r="4" fill="#3ba49a"/>
    <text x="160" y="4" font-family="'Avenir Next', sans-serif" font-size="10.5" fill="#a2b5b0">Active Recall Intervals (1-3-7-30 Days)</text>
  </g>
</svg>
