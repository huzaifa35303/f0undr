<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Clean Editorial Background -->
  <rect width="900" height="500" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="0.5">ROBERT CIALDINI'S 7 UNIVERSAL PERSUASION VECTORS</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" fill="#64748b">The Evolutionary Levers of Human Compliance &amp; Psychological Immunity</text>
  <line x1="150" y1="74" x2="750" y2="74" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Radial Wheel of the 7 Principles -->
  <g transform="translate(450, 275)">
    <!-- Central Hub: Human Decision Matrix -->
    <circle cx="0" cy="0" r="62" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">SUBCONSCIOUS</text>
    <text x="0" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">COMPLIANCE</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">HEURISTICS</text>

    <!-- Node 1: Reciprocity (Top - 0 deg) -->
    <g transform="translate(0, -160)">
      <line x1="0" y1="35" x2="0" y2="98" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#2563eb">1. RECIPROCITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Debt of social obligation</text>
    </g>

    <!-- Node 2: Scarcity (Top Right - 51.4 deg) -->
    <g transform="translate(160, -95)">
      <line x1="-30" y1="18" x2="-80" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="8" fill="#f8fafc" stroke="#fecdd3" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#e11d48">2. SCARCITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">FOMO &amp; dwindling supply</text>
    </g>

    <!-- Node 3: Authority (Right - 102.8 deg) -->
    <g transform="translate(195, 55)">
      <line x1="-35" y1="-8" x2="-95" y2="-20" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="8" fill="#f8fafc" stroke="#fde68a" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#d97706">3. AUTHORITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Symbols, titles &amp; poise</text>
    </g>

    <!-- Node 4: Consistency & Commitment (Bottom Right - 154.2 deg) -->
    <g transform="translate(105, 175)">
      <line x1="-20" y1="-30" x2="-50" y2="-75" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-95" y="-25" width="190" height="50" rx="8" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#7c3aed">4. COMMITMENT</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Foot-in-the-door alignment</text>
    </g>

    <!-- Node 5: Social Proof (Bottom Left - 205.7 deg) -->
    <g transform="translate(-105, 175)">
      <line x1="20" y1="-30" x2="50" y2="-75" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-95" y="-25" width="190" height="50" rx="8" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0284c7">5. SOCIAL PROOF</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Safety in the herd instinct</text>
    </g>

    <!-- Node 6: Liking (Left - 257.1 deg) -->
    <g transform="translate(-195, 55)">
      <line x1="35" y1="-8" x2="95" y2="-20" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="8" fill="#f8fafc" stroke="#fecdd3" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#e11d48">6. LIKING</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Rapport, similarity &amp; warmth</text>
    </g>

    <!-- Node 7: Unity (Top Left - 308.5 deg) -->
    <g transform="translate(-160, -95)">
      <line x1="30" y1="18" x2="80" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#059669">7. UNITY ("WE")</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" fill="#64748b">Shared identity &amp; tribe</text>
    </g>
  </g>
</svg>
