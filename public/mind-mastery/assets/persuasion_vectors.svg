<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="500" rx="8" fill="#152422" stroke="#2a3c39" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" fill="#f5f1e8" letter-spacing="1">ROBERT CIALDINI'S 7 UNIVERSAL PERSUASION VECTORS</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="12" fill="#a2b5b0">The Evolutionary Levers of Human Compliance &amp; Psychological Immunity</text>
  <line x1="150" y1="72" x2="750" y2="72" stroke="#2a3c39" stroke-width="1"/>

  <!-- Radial Wheel / Circular Constellation of the 7 Principles -->
  <g transform="translate(450, 275)">
    <!-- Central Hub: Human Decision Matrix -->
    <circle cx="0" cy="0" r="62" fill="#1b2f2c" stroke="#f0cb75" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Iowan Old Style', serif" font-size="14" font-weight="700" fill="#f5f1e8">SUBCONSCIOUS</text>
    <text x="0" y="10" text-anchor="middle" font-family="'Iowan Old Style', serif" font-size="13" font-style="italic" fill="#f0cb75">COMPLIANCE</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9" fill="#a2b5b0">HEURISTICS</text>

    <!-- Node 1: Reciprocity (Top - 0 deg) -->
    <g transform="translate(0, -160)">
      <line x1="0" y1="35" x2="0" y2="98" stroke="#3ba49a" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#1c302d" stroke="#3ba49a" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#55cfc1">1. RECIPROCITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Debt of social obligation</text>
    </g>

    <!-- Node 2: Scarcity (Top Right - 51.4 deg) -->
    <g transform="translate(160, -95)">
      <line x1="-30" y1="18" x2="-80" y2="50" stroke="#bd5342" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#1c302d" stroke="#bd5342" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#f88975">2. SCARCITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">FOMO &amp; dwindling supply</text>
    </g>

    <!-- Node 3: Authority (Right - 102.8 deg) -->
    <g transform="translate(195, 55)">
      <line x1="-35" y1="-8" x2="-95" y2="-20" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#1c302d" stroke="#d4af37" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#f0cb75">3. AUTHORITY</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Symbols, titles &amp; poise</text>
    </g>

    <!-- Node 4: Consistency & Commitment (Bottom Right - 154.2 deg) -->
    <g transform="translate(105, 175)">
      <line x1="-20" y1="-30" x2="-50" y2="-75" stroke="#3ba49a" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-95" y="-25" width="190" height="50" rx="6" fill="#1c302d" stroke="#3ba49a" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#55cfc1">4. COMMITMENT</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Foot-in-the-door alignment</text>
    </g>

    <!-- Node 5: Social Proof (Bottom Left - 205.7 deg) -->
    <g transform="translate(-105, 175)">
      <line x1="20" y1="-30" x2="50" y2="-75" stroke="#55cfc1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-95" y="-25" width="190" height="50" rx="6" fill="#1c302d" stroke="#55cfc1" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#55cfc1">5. SOCIAL PROOF</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Safety in the herd instinct</text>
    </g>

    <!-- Node 6: Liking (Left - 257.1 deg) -->
    <g transform="translate(-195, 55)">
      <line x1="35" y1="-8" x2="95" y2="-20" stroke="#e5735f" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#1c302d" stroke="#e5735f" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#f88975">6. LIKING</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Rapport, similarity &amp; warmth</text>
    </g>

    <!-- Node 7: Unity (Top Left - 308.5 deg) -->
    <g transform="translate(-160, -95)">
      <line x1="30" y1="18" x2="80" y2="50" stroke="#f0cb75" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#1c302d" stroke="#f0cb75" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="11.5" font-weight="800" fill="#f0cb75">7. UNITY ("WE")</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="9.5" fill="#a2b5b0">Shared identity &amp; tribe</text>
    </g>
  </g>
</svg>
