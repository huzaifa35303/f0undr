<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="halo" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="accent" x1="10" y1="12" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Circular Base (Perfect for Google Search Circle Crop) -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2"/>
  
  <!-- Subtle ambient inner glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#halo)"/>

  <!-- Iconic bold f0 monogram -->
  <g transform="translate(13.5, 17.5)">
    <!-- 'f' stem and crossbar -->
    <path d="M 12 0 C 7.5 0 4.5 3 4.5 7.5 L 4.5 29" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0.5 9.5 L 11.5 9.5" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- '0' symbol -->
    <rect x="18" y="5" width="18" height="24" rx="9" stroke="url(#accent)" stroke-width="4.8" fill="none"/>
    
    <!-- Cyber power core inside 0 -->
    <circle cx="27" cy="17" r="2.4" fill="#38bdf8"/>
  </g>
</svg>
