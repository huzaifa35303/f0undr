<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f1a"/>
      <stop offset="100%" stop-color="#18192e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#a259ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a259ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f7cff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="url(#primaryGrad)" stroke-width="6"/>

  <!-- Subtle glow inner card -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#glow)"/>

  <!-- Display window -->
  <rect x="76" y="80" width="360" height="96" rx="28" fill="#131424" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="112" cy="128" r="8" fill="#4f7cff"/>
  <circle cx="138" cy="128" r="8" fill="#a259ff"/>
  <text x="400" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#f2f2f8" text-anchor="end">888.88</text>

  <!-- Keypad representation -->
  <!-- Row 1 -->
  <rect x="76" y="204" width="72" height="64" rx="20" fill="#202238"/>
  <text x="112" y="244" font-family="system-ui" font-size="24" font-weight="600" fill="#8b8ba7" text-anchor="middle">C</text>
  <rect x="172" y="204" width="72" height="64" rx="20" fill="#202238"/>
  <text x="208" y="244" font-family="system-ui" font-size="24" font-weight="600" fill="#8b8ba7" text-anchor="middle">±</text>
  <rect x="268" y="204" width="72" height="64" rx="20" fill="#202238"/>
  <text x="304" y="244" font-family="system-ui" font-size="24" font-weight="600" fill="#8b8ba7" text-anchor="middle">%</text>
  <rect x="364" y="204" width="72" height="64" rx="20" fill="url(#primaryGrad)"/>
  <text x="400" y="244" font-family="system-ui" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="76" y="284" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="112" y="324" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">7</text>
  <rect x="172" y="284" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="208" y="324" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">8</text>
  <rect x="268" y="284" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="304" y="324" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">9</text>
  <rect x="364" y="284" width="72" height="64" rx="20" fill="url(#primaryGrad)"/>
  <text x="400" y="324" font-family="system-ui" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="76" y="364" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="112" y="404" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">4</text>
  <rect x="172" y="364" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="208" y="404" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">5</text>
  <rect x="268" y="364" width="72" height="64" rx="20" fill="#191a2d"/>
  <text x="304" y="404" font-family="system-ui" font-size="24" font-weight="600" fill="#f2f2f8" text-anchor="middle">6</text>
  <rect x="364" y="364" width="72" height="64" rx="20" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="406" font-family="system-ui" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">=</text>
</svg>
